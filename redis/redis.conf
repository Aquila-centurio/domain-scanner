# Максимальный объём памяти для Redis
# Подбирается под VPS — для 1GB RAM ставим 256mb
maxmemory 256mb

# Политика вытеснения при достижении maxmemory:
# allkeys-lru — удаляет наименее недавно использованные ключи
# Подходит для хранения состояния сканов (старые сканы вытесняются)
maxmemory-policy allkeys-lru

# Персистентность — сохранение на диск
# save <секунд> <изменений> — сохранять если за N секунд было M изменений
save 900 1
save 300 10
save 60 10000

# Директория для RDB снапшотов
dir /data

# Логирование
loglevel notice