services:

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Flask + Gunicorn ─────────────────────────────────────────────────────────
  app:
    build: ./app
    restart: always
    env_file: .env                         # API ключи из .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - uploads_data:/tmp/scanner_uploads  # шарим загрузки с celery_worker
    depends_on:
      redis:
        condition: service_healthy

  # ── Celery Worker ─────────────────────────────────────────────────────────────
  celery_worker:
    build: ./app
    restart: always
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - uploads_data:/tmp/scanner_uploads  # тот же volume что и у app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A tasks worker --loglevel=info -c 2

  # ── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/htpasswd:/etc/nginx/.htpasswd:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app

  # ── Certbot ──────────────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    profiles: ["certbot"]

volumes:
  redis_data:
  uploads_data:
  certbot_certs:
  certbot_www: