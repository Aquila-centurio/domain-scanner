events {
    worker_connections 1024;
}

http {

    # ── Upstream ─────────────────────────────────────────────────────────────
    # Gunicorn слушает на порту 8000 внутри docker сети
    upstream flask_app {
        server app:8000;
    }

    # ── HTTP → HTTPS редирект ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name YOUR_DOMAIN.com;   # ← заменить на реальный домен

        # Путь для верификации certbot (Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Всё остальное — редирект на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name YOUR_DOMAIN.com;   # ← заменить на реальный домен

        # SSL сертификаты от Let's Encrypt
        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.com/privkey.pem;

        # Современные SSL настройки
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # ── Basic Auth ───────────────────────────────────────────────────────
        # Запрашивает логин/пароль перед доступом к сайту
        auth_basic "Domain Scanner";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # ── Проксирование в Flask ─────────────────────────────────────────────
        location / {
            proxy_pass http://flask_app;

            # Передаём реальный IP клиента в Flask
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            # Таймауты для долгих запросов (загрузка файла)
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # Размер загружаемого файла (xlsx могут быть большими)
            client_max_body_size 50M;
        }
    }
}