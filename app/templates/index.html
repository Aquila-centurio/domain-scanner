<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Domain Scanner</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0e17;
      --bg2:      #111827;
      --border:   #1e2d45;
      --text:     #c9d1d9;
      --text-dim: #6b7b8d;
      --accent:   #00e59b;
      --accent2:  #00c4ff;
      --danger:   #ff4757;
      --warning:  #ffa502;
      --success:  #00e59b;
      --mono:     'JetBrains Mono', monospace;
      --sans:     'Outfit', sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(0,229,155,.03) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(0,196,255,.03) 0%, transparent 50%);
      pointer-events: none;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
      position: relative;
      z-index: 1;
    }

    header { text-align: center; margin-bottom: 48px; }
    header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    header p {
      color: var(--text-dim);
      font-size: .95rem;
      font-family: var(--mono);
      font-weight: 300;
    }

    .card {
      background: linear-gradient(135deg, #111827, #0d1321);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
    }
    .card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 24px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      box-shadow: 0 0 12px var(--accent);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 8px; }
    .field.full { grid-column: 1 / -1; }

    label {
      font-size: .82rem;
      font-weight: 500;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: var(--mono);
    }

    input[type="number"],
    input[type="file"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-family: var(--mono);
      font-size: .95rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,229,155,.1);
    }
    input[type="file"] { cursor: pointer; padding: 14px 16px; }
    input[type="file"]::file-selector-button {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-family: var(--sans);
      font-weight: 600;
      font-size: .85rem;
      cursor: pointer;
      margin-right: 12px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      grid-column: 1 / -1;
    }

    button {
      font-family: var(--sans);
      font-weight: 600;
      font-size: .95rem;
      border: none;
      border-radius: 10px;
      padding: 14px 32px;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-go {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000;
      flex: 1;
      box-shadow: 0 4px 24px rgba(0,229,155,.2);
    }
    .btn-go:hover  { transform: translateY(-1px); box-shadow: 0 6px 32px rgba(0,229,155,.3); }
    .btn-go:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .btn-stop {
      background: rgba(255,71,87,.15);
      color: var(--danger);
      border: 1px solid rgba(255,71,87,.3);
    }
    .btn-stop:hover { background: rgba(255,71,87,.25); }
    .btn-csv {
      background: rgba(0,229,155,.1);
      color: var(--accent);
      border: 1px solid rgba(0,229,155,.2);
    }
    .btn-csv:hover { background: rgba(0,229,155,.2); }

    .progress-bar {
      height: 4px;
      background: var(--bg);
      border-radius: 4px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 4px;
      transition: width .3s;
      box-shadow: 0 0 16px var(--accent);
    }
    .step-label {
      font-family: var(--mono);
      font-size: .8rem;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .console {
      background: #050810;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      max-height: 320px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: .78rem;
      line-height: 1.8;
      scroll-behavior: smooth;
    }
    .console::-webkit-scrollbar       { width: 6px; }
    .console::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .log-line { display: flex; gap: 10px; }
    .log-time { color: var(--text-dim); flex-shrink: 0; }
    .log-msg  { word-break: break-all; }
    .log-line.success .log-msg { color: var(--success); }
    .log-line.error   .log-msg { color: var(--danger); }
    .log-line.warning .log-msg { color: var(--warning); }
    .log-line.dim     .log-msg { color: var(--text-dim); }

    .results-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .results-table th {
      text-align: left;
      padding: 12px 14px;
      font-family: var(--mono);
      font-size: .72rem;
      font-weight: 500;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg2);
    }
    .results-table td {
      padding: 11px 14px;
      border-bottom: 1px solid rgba(30,45,69,.5);
      transition: background .15s;
    }
    .results-table tr:hover td { background: rgba(0,229,155,.03); }

    .domain-name { font-family: var(--mono); font-weight: 500; color: var(--accent2); }
    .score-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-family: var(--mono);
      font-weight: 600;
      font-size: .82rem;
    }
    .score-high { background: rgba(0,229,155,.15); color: var(--accent); }
    .score-med  { background: rgba(255,165,2,.15);  color: var(--warning); }
    .vt-clean   { color: var(--success); }
    .vt-flagged { color: var(--danger); font-weight: 600; }

    .table-wrap {
      max-height: 500px;
      overflow-y: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .table-wrap::-webkit-scrollbar       { width: 6px; }
    .table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (max-width: 640px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      text-align: center;
    }
    .stat-num   { font-family: var(--mono); font-size: 1.6rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: .7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

    .hidden { display: none; }
    .bid-link {
      color: var(--accent2);
      text-decoration: none;
      font-size: .78rem;
      opacity: .7;
      transition: opacity .2s;
    }
    .bid-link:hover { opacity: 1; text-decoration: underline; }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .scanning .dot { animation: pulse 1.2s infinite; }

    /* Filter status badge */
    .filter-info {
      font-family: var(--mono);
      font-size: .78rem;
      color: var(--text-dim);
      margin-top: 10px;
      min-height: 20px;
    }
    .filter-info.ok { color: var(--accent); }
    .filter-info.warn { color: var(--warning); }
    .filter-info.err { color: var(--danger); }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>Domain Scanner</h1>
    <p>filter in browser &rarr; upload filtered rows &rarr; scamdoc &rarr; virustotal</p>
  </header>

  <!-- Settings -->
  <div class="card">
    <h2><span class="dot"></span> Scan Settings</h2>
    <div class="form-grid">

      <div class="field full">
        <label>Namecheap File (.csv or .tsv)</label>
        <input type="file" id="fileInput" accept=".csv,.tsv" onchange="onFileChange()">
        <div class="filter-info" id="filterInfo"></div>
      </div>

      <div class="field">
        <label>Auction Ends (min hours)</label>
        <input type="number" id="minHours" value="3" min="0" step="1" onchange="onFileChange()">
      </div>
      <div class="field">
        <label>Auction Ends (max hours)</label>
        <input type="number" id="maxHours" value="24" min="1" step="1" onchange="onFileChange()">
      </div>
      <div class="field">
        <label>Min ScamDoc Score (skip below)</label>
        <input type="number" id="minSD" value="70" min="0" max="100">
      </div>
      <div class="field">
        <label>Great Threshold (above = great)</label>
        <input type="number" id="maxSD" value="80" min="0" max="100">
      </div>
      <div class="field">
        <label>Max Price $ (0 = any)</label>
        <input type="number" id="maxPrice" value="20" min="0" step="1" onchange="onFileChange()">
      </div>
      <div class="field">
        <label>Max Domains to Check (0 = all)</label>
        <input type="number" id="limit" value="50" min="0">
      </div>

      <div class="actions">
        <button class="btn-go" id="btnScan" onclick="startScan()">Start Scan</button>
        <button class="btn-stop hidden" id="btnStop" onclick="stopScan()">Stop</button>
      </div>
    </div>
  </div>

  <!-- Progress -->
  <div class="card hidden" id="progressCard">
    <h2 class="scanning"><span class="dot"></span> <span id="stepLabel">Scanning...</span></h2>
    <div class="step-label">
      <span id="progressText">0 / 0</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="console" id="logConsole"></div>
  </div>

  <!-- Great results -->
  <div class="card hidden" id="resultsGreatCard">
    <h2><span class="dot"></span> Great Domains</h2>
    <div class="stat-grid" id="statGrid"></div>
    <div class="table-wrap">
      <table class="results-table">
        <thead><tr>
          <th>#</th><th>Domain</th><th>ScamDoc</th><th>Ends In</th>
          <th>Price</th><th>Bids</th><th>Registered</th><th>DR</th><th>VT</th><th></th>
        </tr></thead>
        <tbody id="greatBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Good results -->
  <div class="card hidden" id="resultsGoodCard">
    <h2><span class="dot" style="background:var(--warning)"></span> Good Domains</h2>
    <div class="table-wrap">
      <table class="results-table">
        <thead><tr>
          <th>#</th><th>Domain</th><th>ScamDoc</th><th>Ends In</th>
          <th>Price</th><th>Bids</th><th>Registered</th><th>DR</th><th>VT</th><th></th>
        </tr></thead>
        <tbody id="goodBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Download -->
  <div class="card hidden" id="downloadCard">
    <button class="btn-csv" onclick="downloadXlsx()">Download Results (.xlsx)</button>
  </div>

</div>

<script>
  let pollTimer = null, lastLogCount = 0;
  let currentTaskId = localStorage.getItem('currentTaskId');
  if (currentTaskId) {
    document.getElementById('progressCard').classList.remove('hidden');
    document.getElementById('btnScan').disabled = true;
    document.getElementById('btnStop').classList.remove('hidden');
    pollStatus();
    pollTimer = setInterval(pollStatus, 1500);
  }

  // ── Client-side CSV filtering ──────────────────────────────────────────────

  let filteredCsvBlob = null;  // результат фильтрации — готов к отправке

  function parseCSVLine(line) {
    // Простой парсер CSV с учётом кавычек
    const result = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
      else { cur += c; }
    }
    result.push(cur);
    return result;
  }

  function filterCSV(text, minHours, maxHours, maxPrice) {
    const lines = text.split('\n');
    if (lines.length < 2) return { blob: null, total: 0, passed: 0, header: '' };

    const header = lines[0];
    const now = Date.now();
    const windowStart = now + minHours * 3600 * 1000;
    const windowEnd   = now + maxHours * 3600 * 1000;

    let total = 0, passed = 0;
    const kept = [];

    for (let i = 1; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      total++;

      const parts = parseCSVLine(line);
      if (parts.length < 15) continue;

      // col 1 = domain
      const domain = (parts[1] || '').trim().toLowerCase();
      if (!domain.endsWith('.com')) continue;

      // col 14 = registeredDate
      const regStr = (parts[14] || '').trim();
      if (!regStr) continue;
      const regYear = parseInt(regStr.slice(0, 4), 10);
      if (isNaN(regYear) || regYear < 2000 || regYear > 2016) continue;

      // col 3 = endDate
      const endStr = (parts[3] || '').trim();
      let endTs;
      try { endTs = new Date(endStr).getTime(); } catch(e) { continue; }
      if (isNaN(endTs)) continue;
      if (endTs < windowStart || endTs > windowEnd) continue;

      // col 4 = price
      const price = parseFloat(parts[4]);
      if (maxPrice > 0 && price > maxPrice) continue;

      passed++;
      kept.push(line);
    }

    if (kept.length === 0) return { blob: null, total, passed: 0, header };

    const csvContent = header + '\n' + kept.join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv' });
    return { blob, total, passed, header };
  }

  let filterDebounce = null;
  function onFileChange() {
    filteredCsvBlob = null;
    const info = document.getElementById('filterInfo');
    const fi = document.getElementById('fileInput');
    if (!fi.files.length) { info.textContent = ''; return; }

    const file = fi.files[0];
    // Только CSV/TSV поддерживается для клиентской фильтрации
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext !== 'csv' && ext !== 'tsv') {
      info.className = 'filter-info warn';
      info.textContent = 'XLSX files are sent as-is (no client filtering)';
      return;
    }

    info.className = 'filter-info';
    info.textContent = 'Reading file...';

    clearTimeout(filterDebounce);
    filterDebounce = setTimeout(() => {
      const minHours = parseFloat(document.getElementById('minHours').value) || 0;
      const maxHours = parseFloat(document.getElementById('maxHours').value) || 999;
      const maxPrice = parseFloat(document.getElementById('maxPrice').value) || 0;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        const result = filterCSV(text, minHours, maxHours, maxPrice);
        filteredCsvBlob = result.blob;

        if (result.passed === 0) {
          info.className = 'filter-info err';
          info.textContent = `No matching domains found in ${result.total.toLocaleString()} rows. Try widening the auction window.`;
        } else {
          const kb = filteredCsvBlob ? (filteredCsvBlob.size / 1024).toFixed(1) : 0;
          info.className = 'filter-info ok';
          info.textContent = `✓ ${result.passed} domains matched out of ${result.total.toLocaleString()} rows — sending ${kb} KB instead of ${(file.size/1024/1024).toFixed(1)} MB`;
        }
      };
      reader.onerror = function() {
        info.className = 'filter-info err';
        info.textContent = 'Failed to read file';
      };
      reader.readAsText(file, 'utf-8');
    }, 300);
  }

  // ── Main scan ──────────────────────────────────────────────────────────────

  function startScan() {
    const fi = document.getElementById('fileInput');
    if (!fi.files.length) { alert('Select a file first.'); return; }

    const minHours   = parseFloat(document.getElementById('minHours').value) || 0;
    const maxHours   = parseFloat(document.getElementById('maxHours').value) || 999;
    const maxPrice   = parseFloat(document.getElementById('maxPrice').value) || 0;
    const limit      = document.getElementById('limit').value;
    const minSD      = document.getElementById('minSD').value;
    const maxSD      = document.getElementById('maxSD').value;

    document.getElementById('btnScan').disabled = true;
    document.getElementById('btnStop').classList.remove('hidden');
    document.getElementById('progressCard').classList.remove('hidden');
    ['resultsGreatCard','resultsGoodCard','downloadCard'].forEach(id =>
      document.getElementById(id).classList.add('hidden'));
    document.getElementById('logConsole').innerHTML = '';
    document.getElementById('greatBody').innerHTML  = '';
    document.getElementById('goodBody').innerHTML   = '';
    lastLogCount = 0;

    document.getElementById('stepLabel').textContent = 'Filtering in browser...';
    document.getElementById('progressText').textContent = '';
    document.getElementById('progressPct').textContent = '';
    document.getElementById('progressFill').style.width = '0%';

    const file = fi.files[0];
    const ext = file.name.split('.').pop().toLowerCase();

    // Для xlsx отправляем как есть (нет клиентской фильтрации)
    if (ext === 'xlsx' || ext === 'xls') {
      sendFile(file, file.name, minHours, maxHours, maxPrice, limit, minSD, maxSD);
      return;
    }

    // Для CSV — фильтруем в браузере
    const doFilter = () => {
      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        const result = filterCSV(text, minHours, maxHours, maxPrice);

        if (!result.blob || result.passed === 0) {
          alert(`No matching domains found in ${result.total.toLocaleString()} rows.\nTry widening the auction window or price limit.`);
          resetUI();
          return;
        }

        const kb = (result.blob.size / 1024).toFixed(1);
        addLog(`Filtered ${result.passed} domains from ${result.total.toLocaleString()} rows (${kb} KB)`, 'success');
        sendFile(result.blob, 'filtered.csv', minHours, maxHours, maxPrice, limit, minSD, maxSD);
      };
      reader.onerror = () => { alert('Failed to read file'); resetUI(); };
      reader.readAsText(file, 'utf-8');
    };

    doFilter();
  }

  function addLog(msg, level) {
    const c = document.getElementById('logConsole');
    const now = new Date();
    const t = now.toTimeString().slice(0,8);
    c.innerHTML += `<div class="log-line ${level}"><span class="log-time">${t}</span><span class="log-msg">${escHtml(msg)}</span></div>`;
    c.scrollTop = c.scrollHeight;
  }

  function sendFile(fileOrBlob, filename, minHours, maxHours, maxPrice, limit, minSD, maxSD) {
    const fd = new FormData();
    fd.append('file', fileOrBlob, filename);
    fd.append('min_hours',    minHours);
    fd.append('max_hours',    maxHours);
    fd.append('limit',        limit);
    fd.append('min_sd_score', minSD);
    fd.append('max_sd_score', maxSD);
    fd.append('max_price',    maxPrice);

    document.getElementById('stepLabel').textContent = 'Uploading...';

    const xhr = new XMLHttpRequest();

    xhr.upload.addEventListener('progress', function(e) {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        const kb_done  = (e.loaded  / 1024).toFixed(0);
        const kb_total = (e.total   / 1024).toFixed(0);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressPct').textContent  = pct + '%';
        document.getElementById('progressText').textContent = kb_done + ' KB / ' + kb_total + ' KB';
      }
    });

    xhr.addEventListener('load', function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          const d = JSON.parse(xhr.responseText);
          if (d.error) { alert(d.error); resetUI(); return; }
          currentTaskId = d.task_id;
          localStorage.setItem('currentTaskId', d.task_id);
          document.getElementById('stepLabel').textContent = 'Filtering on server...';
          document.getElementById('progressFill').style.width = '0%';
          document.getElementById('progressText').textContent = '0 / 0';
          document.getElementById('progressPct').textContent  = '0%';
          pollTimer = setInterval(pollStatus, 1500);
        } catch(e) { alert('Server error: ' + xhr.responseText); resetUI(); }
      } else {
        alert('Upload failed: HTTP ' + xhr.status + '\n' + xhr.responseText);
        resetUI();
      }
    });

    xhr.addEventListener('error', function() {
      alert('Network error during upload.'); resetUI();
    });

    xhr.open('POST', '/scan');
    xhr.send(fd);
  }

  function stopScan() {
    if (!currentTaskId) return;
    fetch('/stop?task_id=' + currentTaskId, { method: 'POST' });
  }

  function pollStatus() {
    if (!currentTaskId) return;
    fetch('/status?task_id=' + currentTaskId)
      .then(r => r.json())
      .then(data => {
        const pct = data.total > 0 ? Math.round((data.progress / data.total) * 100) : 0;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressPct').textContent  = pct + '%';
        document.getElementById('progressText').textContent = data.progress + ' / ' + data.total;

        const steps = { filtering: 'Filtering...', scamdoc: 'ScamDoc Scan', virustotal: 'VirusTotal Scan', done: 'Complete' };
        document.getElementById('stepLabel').textContent = steps[data.step] || data.step;

        if (data.logs && data.logs.length > lastLogCount) {
          const c = document.getElementById('logConsole');
          data.logs.slice(lastLogCount).forEach(l => {
            c.innerHTML += `<div class="log-line ${l.level}"><span class="log-time">${l.time}</span><span class="log-msg">${escHtml(l.msg)}</span></div>`;
          });
          c.scrollTop = c.scrollHeight;
          lastLogCount = data.logs.length;
        }

        if (data.results_great && (data.results_great.length || data.results_good.length || data.flagged.length))
          renderResults(data.results_great, data.results_good, data.flagged, data.stats);

        if (!data.running && data.step === 'done') {
          clearInterval(pollTimer);
          resetUI();
        }
      })
      .catch(() => {});
  }

  function buildRows(list) {
    return list
      .sort((a, b) => (b.scamdoc_score || 0) - (a.scamdoc_score || 0))
      .map((d, i) => {
        const sc    = d.scamdoc_score || 0;
        const cls   = sc >= 80 ? 'score-high' : 'score-med';
        const clean = (d.vt_malicious || 0) === 0;
        const price = d.price > 0 ? '$' + d.price : '-';
        const dr    = d.ahrefs_dr > 0 ? Math.round(d.ahrefs_dr) : '-';
        return `<tr>
          <td style="color:var(--text-dim)">${i + 1}</td>
          <td class="domain-name">${escHtml(d.domain)}</td>
          <td><span class="score-badge ${cls}">${sc}%</span></td>
          <td>${d.hours_left}h</td>
          <td style="color:var(--warning)">${price}</td>
          <td>${d.bid_count || 0}</td>
          <td style="color:var(--text-dim)">${d.reg_date || ''}</td>
          <td>${dr}</td>
          <td class="${clean ? 'vt-clean' : 'vt-flagged'}">${clean ? 'Clean' : d.vt_malicious + ' flags'}</td>
          <td><a href="${escHtml(d.url || '#')}" target="_blank" class="bid-link">Bid &rarr;</a></td>
        </tr>`;
      }).join('');
  }

  function renderResults(great, good, flagged, stats) {
    document.getElementById('statGrid').innerHTML =
      statBox(great.length, 'Great') +
      statBox(good.length, 'Good') +
      statBox(flagged.length, 'VT Flagged') +
      statBox((stats && stats.reg_2000_2016) || 0, 'Reg 00-16');

    if (great.length) {
      document.getElementById('resultsGreatCard').classList.remove('hidden');
      document.getElementById('greatBody').innerHTML = buildRows(great);
    }
    if (good.length) {
      document.getElementById('resultsGoodCard').classList.remove('hidden');
      document.getElementById('goodBody').innerHTML = buildRows(good);
    }
    if (great.length || good.length)
      document.getElementById('downloadCard').classList.remove('hidden');
  }

  function statBox(n, l) {
    return `<div class="stat-box"><div class="stat-num">${n}</div><div class="stat-label">${l}</div></div>`;
  }

  function resetUI() {
    document.getElementById('btnScan').disabled = false;
    document.getElementById('btnStop').classList.add('hidden');
    localStorage.removeItem('currentTaskId');
  }

  function downloadXlsx() {
    if (currentTaskId) window.location.href = '/download?task_id=' + currentTaskId;
  }

  function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
  }
</script>
</body>
</html>
